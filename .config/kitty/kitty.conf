# =========================
# FUENTE
# =========================
font_family MesloLGS NF
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.0

# =========================
# VENTANA / APARIENCIA
# =========================
background_opacity 0.50
dynamic_background_opacity yes
confirm_os_window_close 0
hide_window_decorations no
window_padding_width 10
remember_window_size  yes
initial_window_width  110c
initial_window_height 30c

# =========================
# CURSOR
# =========================
cursor_shape beam
cursor_beam_thickness 1.8
cursor #f5a9d0
cursor_text_color #0f0f17

# =========================
# SELECCIÓN
# =========================
selection_foreground #0f0f17
selection_background #c7b8ff

# =========================
# URLS
# =========================
detect_urls yes
url_color #89dceb
url_style curly

# =========================
# RENDIMIENTO
# =========================
repaint_delay 10
input_delay 3
sync_to_monitor yes

# =========================
# TABS
# =========================
tab_bar_style powerline
tab_powerline_style round
tab_bar_edge top
tab_bar_background #0f0f17

active_tab_foreground   #0f0f17
active_tab_background   #f5a9d0
active_tab_font_style   bold

inactive_tab_foreground #b8b4d9
inactive_tab_background #171826
inactive_tab_font_style normal

# =========================
# NAVEGACIÓN ENTRE VENTANAS
# =========================
map ctrl+left neighboring_window left
map ctrl+right neighboring_window right
map ctrl+up neighboring_window up
map ctrl+down neighboring_window down

map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+m toggle_layout stack

# =========================
# SHELL
# =========================
shell /usr/bin/zsh

# =========================
# COLORES BASE
# =========================
foreground #e8e6f2
background #0f0f17

# negros / grises
color0  #0f0f17
color8  #565f89

# rojo / rosa fuerte
color1  #f38ba8
color9  #ec7fb8

# verde
color2  #a6e3a1
color10 #b8f2b3

# amarillo
color3  #f9e2af
color11 #ffdca8

# azul
color4  #7aa2f7
color12 #89dceb

# magenta / violeta / rosa pastel
color5  #b48cf2
color13 #f5a9d0

# cyan
color6  #89dceb
color14 #a6e3ff

# blanco
color7  #cdd6f4
color15 #f5f5ff

# =========================
# BORDES
# =========================
active_border_color   #b48cf2
inactive_border_color #26283f
bell_border_color     #f5a9d0

# =========================
# LIGADURAS / CAMPANA
# =========================
disable_ligatures never
enable_audio_bell no
visual_bell_duration 0.0
